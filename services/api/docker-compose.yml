# Ambiente local completo: Oracle Free + API (para testar sem o servidor da FIAP).
# Uso: docker compose up --build   ->  http://localhost:8080/swagger-ui.html
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: vias
      APP_USER_PASSWORD: vias
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: vias
      DB_PASS: vias
      CORS_ORIGENS: http://localhost:3000
    ports:
      - "8080:8080"
